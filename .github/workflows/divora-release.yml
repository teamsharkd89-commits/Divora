name: Divora Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID of the Divora APK workflow run to take the APK from'
        required: true
        type: string
      tag:
        description: 'Release tag to upload the APK to (must already exist)'
        required: true
        type: string
        default: 'v1.0.1'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: divora-release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh apk/
          cp apk/*.apk Divora.apk
          ls -lh Divora.apk
          gh release upload ${{ inputs.tag }} Divora.apk --clobber
