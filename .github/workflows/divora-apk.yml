name: Divora APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Divora's own signing key: without it every build falls back to the runner's fresh debug key,
      # so Android refuses to install one build over another ("signed with a different key").
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.DIVORA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.DIVORA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DIVORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DIVORA_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > divora-release.jks
          cat > keystore.properties <<EOF
          storeFile=divora-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: divora-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
